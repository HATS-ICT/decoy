[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "decoy"
version = "0.2.0"
description = "A data-driven discretized CS:GO simulation environment for strategic multi-agent planning research"
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [
    { name = "Yunzhe Wang" },
    { name = "Volkan Ustun" },
    { name = "Chris McGroarty" },
]
keywords = ["reinforcement-learning", "multi-agent", "simulation", "csgo", "pettingzoo"]

# Runtime dependencies for the simulation environment itself.
dependencies = [
    "panda3d==1.10.15",
    # torch 2.12-2.14 fail to load their DLLs on some Windows setups
    # (OSError WinError 1114 on c10.dll); 2.11 is the last version verified here.
    "torch>=2.0,<2.12",
    "numpy>=1.24",
    "scipy>=1.10",
    "networkx>=3.0",
    "pettingzoo>=1.24",
    "gymnasium>=0.29",
    "tqdm>=4.65",
]

[project.optional-dependencies]
# Training the damage models from replay data.
trainer = [
    "pandas>=2.0",
    "matplotlib>=3.7",
    "scikit-learn>=1.3",
    "joblib>=1.3",
    "seaborn>=0.13",
    "wandb>=0.16",
]
# Offline trajectory analysis and plotting.
analysis = [
    "pandas>=2.0",
    "matplotlib>=3.7",
    "seaborn>=0.13",
    "plotly>=5.18",
]
# Fetching the decompiled map from Google Drive.
assets = ["gdown>=5.0"]
dev = ["pytest>=7.4"]
all = ["decoy[trainer,analysis,assets,dev]"]

[project.urls]
Repository = "https://github.com/yunzhewang/decoy"

[tool.setuptools]
packages = ["env", "trainer", "analysis", "marl"]

[tool.setuptools.package-data]
env = ["assets/*.json", "assets/*.png", "assets/*.glb", "assets/*.pth"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# Each test builds a full engine (75MB map + two checkpoints), so the suite is
# slow by construction. -p no:randomly keeps ShowBase creation strictly ordered.
addopts = "-q"
